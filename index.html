<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpoSystem - Panel de Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: #121824; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.2rem; color: #fff; }
        select, input, textarea { background-color: #334155; color: #fff; border: 1px solid #475569; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 320px; background-color: #1e293b; border-right: 1px solid #334155; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: #38bdf8; margin-top: 15px; font-weight: bold; letter-spacing: 0.05em; border-bottom: 1px solid #334155; padding-bottom: 3px; }
        .subsection-title { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin-left: 10px; font-style: italic; margin-top: 5px; }
        .topic-list { display: flex; flex-direction: column; gap: 5px; margin-left: 10px; }
        .topic-item { display: flex; align-items: center; font-size: 0.9rem; cursor: pointer; padding: 6px; border-radius: 4px; }
        .topic-item:hover { background-color: #334155; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; background-color: #ef4444; }
        .add-topic-form { display: flex; flex-direction: column; gap: 8px; background: #0f172a; padding: 12px; border-radius: 6px; margin-top: 15px; }
        .add-topic-form input, .add-topic-form select { width: 100%; margin-bottom: 4px; }
        .content-panel { flex: 1; padding: 30px; overflow-y: auto; background-color: #0f172a; display: flex; flex-direction: column; gap: 15px; }
        .content-panel input { font-size: 1.5rem; font-weight: bold; background: transparent; border: none; border-bottom: 2px solid #334155; padding-bottom: 5px; color: #fff; width: 100%; }
        .content-panel textarea { flex: 1; resize: none; background-color: #1e293b; padding: 15px; border-radius: 8px; line-height: 1.6; border: 1px solid #334155; color: #e2e8f0; }
        .chat-panel { width: 320px; background-color: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { padding: 15px; border-bottom: 1px solid #334155; font-weight: bold; color: #fff; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; font-size: 0.9rem; }
        .message.claude { background-color: #1e1b4b; border-left: 3px solid #6366f1; padding: 10px; border-radius: 6px; }
        .btn { background-color: #6366f1; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #4f46e5; }
    </style>
</head>
<body>

    <header>
        <h1>OpoSystem 🎓</h1>
        <select id="profile-selector">
            <option value="alicante">Ayuntamiento de Alicante (Activo)</option>
            <option value="valencia">Ayuntamiento de Valencia</option>
        </select>
    </header>

    <div class="main-container">
        <nav class="sidebar">
            <div class="section-title">📚 Temario General</div>
            <div id="lista-general" class="topic-list"></div>
            
            <div class="section-title">⚖️ Temario Legislativo</div>
            <div id="lista-legislativo" class="topic-list"></div>
            
            <div class="section-title">📍 Bloque Específico</div>
            <div class="subsection-title">🌍 Geografía Local</div>
            <div id="lista-geografia" class="topic-list"></div>
            
            <div class="subsection-title">⚙️ Procedimientos</div>
            <div id="lista-procedimientos" class="topic-list"></div>

            <div class="add-topic-form">
                <input type="text" id="new-topic-title" placeholder="Nombre del tema...">
                <select id="new-topic-block">
                    <option value="general">Temario General</option>
                    <option value="legislativo">Temario Legislativo</option>
                    <option value="geografia">Específico: Geografía</option>
                    <option value="procedimientos">Específico: Procedimientos</option>
                </select>
                <button class="btn" id="btn-add-topic">＋ Añadir al Temario</button>
            </div>
        </nav>

                <!-- Columna 2: Panel de Estudio Avanzado con 3 Pestañas -->
        <main class="content-panel">
            <input type="text" id="edit-title" value="Selecciona un tema para empezar">
            
            <!-- Barra de Pestañas -->
            <div style="display: flex; gap: 5px; border-bottom: 2px solid #334155; padding-bottom: 2px;">
                <button class="btn tab-btn" id="tab-temario" onclick="cambiarPestaña('temario')" style="background: #6366f1;">📖 1. Temario Base</button>
                <button class="btn tab-btn" id="tab-resumenes" onclick="cambiarPestaña('resumenes')" style="background: #334155;">📝 2. Mis Resúmenes</button>
                <button class="btn tab-btn" id="tab-ejercicios" onclick="cambiarPestaña('ejercicios')" style="background: #334155;">🏋️ 3. Ejercicios y Exámenes</button>
            </div>

            <!-- Área de control de subida de archivos (Soporta PDF e Imágenes) -->
            <div style="background: #1e293b; padding: 12px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                <p id="upload-instruction" style="font-size: 0.85rem; color: #94a3b8; margin: 0;">Añade contenido a esta sección para que Claude lo analice:</p>
                <input type="file" id="media-uploader" accept=".pdf, image/*" style="display: none;">
                <button class="btn" id="btn-trigger-media" style="background-color: #10b981; padding: 6px 12px; font-size: 0.85rem;" disabled>📂 Adjuntar Archivo/Foto</button>
            </div>

            <!-- Cuadro de texto único que cambia según la pestaña activa -->
            <textarea id="edit-content" placeholder="Selecciona una pestaña y añade tus apuntes, resúmenes o pega el texto aquí..." disabled></textarea>
        </main>


        <aside class="chat-panel">
            <div class="chat-header">🤖 Claude: Tutor de Oposiciones</div>
            <div class="chat-messages">
                <div class="message claude">Selecciona un tema. Analizaré tus textos para generar exámenes según tu municipio.</div>
            </div>
        </aside>
    </div>

    <script>
                const datosPorDefecto = {
            municipio: "alicante", temaSeleccionadoId: null, bloqueSeleccionado: null, pestañaActiva: "temario",
            general: [{ id: "g1", titulo: "Tema General 1", temario: "Contenido...", resumenes: "Mis esquemas...", ejercicios: "Mis test..." }],
            legislativo: [{ id: "l1", titulo: "Tema Leg. 1: Constitución", temario: "Artículo 1...", resumenes: "", ejercicios: "" }],
            especifico_alicante: {
                geografia: [{ id: "alc-g1", titulo: "Geo ALC: Término Municipal", temario: "", resumenes: "", ejercicios: "" }],
                procedimientos: [{ id: "alc-p1", titulo: "Proc ALC: Licencias", temario: "", resumenes: "", ejercicios: "" }]
            },
            especifico_valencia: {
                geografia: [{ id: "vlc-g1", titulo: "Geo VLC: Albufera", temario: "", resumenes: "", ejercicios: "" }],
                procedimientos: [{ id: "vlc-p1", titulo: "Proc VLC: Trámites", temario: "", resumenes: "", ejercicios: "" }]
            }
        };


        let baseDeDatos = JSON.parse(localStorage.getItem('opo_database')) || datosPorDefecto;

        const profileSelector = document.getElementById('profile-selector');
        const listaGeneral = document.getElementById('lista-general');
        const listaLegislativo = document.getElementById('lista-legislativo');
        const listaGeografia = document.getElementById('lista-geografia');
        const listaProcedimientos = document.getElementById('lista-procedimientos');
        const editTitle = document.getElementById('edit-title');
        const editContent = document.getElementById('edit-content');
        const btnAddTopic = document.getElementById('btn-add-topic');
        const newTopicTitle = document.getElementById('new-topic-title');
        const newTopicBlock = document.getElementById('new-topic-block');

        function sincronizarAlmacenamiento() { localStorage.setItem('opo_database', JSON.stringify(baseDeDatos)); }

        function renderizarMenu() {
            listaGeneral.innerHTML = ""; listaLegislativo.innerHTML = ""; listaGeografia.innerHTML = ""; listaProcedimientos.innerHTML = "";
            profileSelector.value = baseDeDatos.municipio;

            baseDeDatos.general.forEach(t => { listaGeneral.innerHTML += `<div class="topic-item" onclick="cargarTema('${t.id}', 'general')"><span class="status-dot"></span> ${t.titulo}</div>`; });
            baseDeDatos.legislativo.forEach(t => { listaLegislativo.innerHTML += `<div class="topic-item" onclick="cargarTema('${t.id}', 'legislativo')"><span class="status-dot"></span> ${t.titulo}</div>`; });

            const esp = baseDeDatos.municipio === "alicante" ? baseDeDatos.especifico_alicante : baseDeDatos.especifico_valencia;
            esp.geografia.forEach(t => { listaGeografia.innerHTML += `<div class="topic-item" onclick="cargarTema('${t.id}', 'geografia')"><span class="status-dot"></span> ${t.titulo}</div>`; });
            esp.procedimientos.forEach(t => { listaProcedimientos.innerHTML += `<div class="topic-item" onclick="cargarTema('${t.id}', 'procedimientos')"><span class="status-dot"></span> ${t.titulo}</div>`; });
        }
        window.cargarTema = function(id, bloque) {
            baseDeDatos.temaSeleccionadoId = id; baseDeDatos.bloqueSeleccionado = bloque;
            let tema = (bloque === 'general') ? baseDeDatos.general.find(t => t.id === id) : (bloque === 'legislativo') ? baseDeDatos.legislativo.find(t => t.id === id) : (baseDeDatos.municipio === "alicante" ? baseDeDatos.especifico_alicante[bloque].find(t => t.id === id) : baseDeDatos.especifico_valencia[bloque].find(t => t.id === id));
            if (tema) { editTitle.value = tema.titulo; editContent.value = tema.texto; editTitle.disabled = false; editContent.disabled = false; }
            sincronizarAlmacenamiento();
        }

        function guardarProgresoActual() {
            const id = baseDeDatos.temaSeleccionadoId; const bloque = baseDeDatos.bloqueSeleccionado; if (!id) return;
            let tema = (bloque === 'general') ? baseDeDatos.general.find(t => t.id === id) : (bloque === 'legislativo') ? baseDeDatos.legislativo.find(t => t.id === id) : (baseDeDatos.municipio === "alicante" ? baseDeDatos.especifico_alicante[bloque].find(t => t.id === id) : baseDeDatos.especifico_valencia[bloque].find(t => t.id === id));
            if (tema) { tema.titulo = editTitle.value; tema.texto = editContent.value; renderizarMenu(); sincronizarAlmacenamiento(); }
        }

        editTitle.addEventListener('input', guardarProgresoActual);
        editContent.addEventListener('input', guardarProgresoActual);
        
        profileSelector.addEventListener('change', (e) => { baseDeDatos.municipio = e.target.value; editTitle.value = "Selecciona un tema para empezar"; editContent.value = ""; baseDeDatos.temaSeleccionadoId = null; renderizarMenu(); sincronizarAlmacenamiento(); });

        btnAddTopic.addEventListener('click', () => {
            const titulo = newTopicTitle.value.trim(); if (!titulo) return alert("Escribe el nombre del tema");
            const nuevoId = "tema-" + Date.now(); const nuevoTema = { id: nuevoId, titulo: titulo, texto: "" }; const bloque = newTopicBlock.value;
            if (bloque === 'general') baseDeDatos.general.push(nuevoTema);
            else if (bloque === 'legislativo') baseDeDatos.legislativo.push(nuevoTema);
            else { const esp = baseDeDatos.municipio === "alicante" ? baseDeDatos.especifico_alicante : baseDeDatos.especifico_valencia; esp[bloque].push(nuevoTema); }
            newTopicTitle.value = ""; renderizarMenu(); cargarTema(nuevoId, bloque); sincronizarAlmacenamiento();
        });

        renderizarMenu(); editTitle.disabled = true; editContent.disabled = true;
                // Función para cambiar entre Temario, Resúmenes y Ejercicios
        window.cambiarPestaña = function(pestaña) {
            baseDeDatos.pestañaActiva = pestaña;
            
            // Cambiar colores de los botones de pestañas
            document.querySelectorAll('.tab-btn').forEach(btn => btn.style.background = '#334155');
            document.getElementById('tab-' + pestaña).style.background = '#6366f1';
            
            // Actualizar instrucciones en pantalla
            const inst = document.getElementById('upload-instruction');
            if(pestaña === 'temario') inst.innerText = "📖 Subir o editar el Temario Oficial de la oposición:";
            if(pestaña === 'resumenes') inst.innerText = "📝 Sube tus propios esquemas o resúmenes:";
            if(pestaña === 'ejercicios') inst.innerText = "🏋️ Sube capturas de test o ejercicios realizados:";

            // Recargar el texto correspondiente al tema y pestaña seleccionada
            refrescarContenidoPantalla();
        };

        function refrescarContenidoPantalla() {
            const id = baseDeDatos.temaSeleccionadoId;
            const bloque = baseDeDatos.bloqueSeleccionado;
            const pestaña = baseDeDatos.pestañaActiva;
            if (!id) return;

            let tema = obtenerTemaActual(id, bloque);
            if (tema) {
                // Si la pestaña está vacía en este tema, asegurar que no de error
                editContent.value = tema[pestaña] || "";
            }
        }

        function obtenerTemaActual(id, bloque) {
            if (bloque === 'general') return baseDeDatos.general.find(t => t.id === id);
            if (bloque === 'legislativo') return baseDeDatos.legislativo.find(t => t.id === id);
            const esp = baseDeDatos.municipio === "alicante" ? baseDeDatos.especifico_alicante : baseDeDatos.especifico_valencia;
            return esp[bloque].find(t => t.id === id);
        }

        // Modificar la función guardarProgresoActual para que guarde en la pestaña correcta
        function guardarProgresoActual() {
            const id = baseDeDatos.temaSeleccionadoId;
            const bloque = baseDeDatos.bloqueSeleccionado;
            const pestaña = baseDeDatos.pestañaActiva;
            if (!id) return;

            let tema = obtenerTemaActual(id, bloque);
            if (tema) {
                tema.titulo = editTitle.value;
                tema[pestaña] = editContent.value;
                renderizarMenu();
                sincronizarAlmacenamiento();
            }
        }

        // Habilitar botón de archivos al cargar un tema
        const originalCargarTemaAdvanced = window.cargarTema;
        window.cargarTema = function(id, bloque) {
            baseDeDatos.temaSeleccionadoId = id;
            baseDeDatos.bloqueSeleccionado = bloque;
            let tema = obtenerTemaActual(id, bloque);
            if(tema) {
                editTitle.value = tema.titulo;
                editTitle.disabled = false;
                editContent.disabled = false;
                document.getElementById('btn-trigger-media').disabled = false;
                refrescarContenidoPantalla();
            }
        };

        // Lógica para procesar la subida del archivo (PDF o Imagen)
        const mediaUploader = document.getElementById('media-uploader');
        document.getElementById('btn-trigger-media').addEventListener('click', () => mediaUploader.click());

        mediaUploader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            // SI ES UNA IMAGEN: La convertimos a formato Base64 para que Claude pueda "verla" en el futuro
            if (file.type.startsWith('image/')) {
                reader.onload = function(event) {
                    editContent.value += `\n[IMAGEN_ADJUNTA: ${file.name}]\n${event.target.result}\n`;
                    guardarProgresoActual();
                    alert("¡Imagen adjuntada con éxito a esta pestaña!");
                };
                reader.readAsDataURL(file);
            } 
            // SI ES UN PDF: Avisamos de que guarde el texto del temario
            else if (file.type === 'application/pdf') {
                alert("PDF detectado. En la siguiente actualización vincularemos el lector automático de texto directamente a esta pestaña.");
            }
        });

    </script>
</body>
</html>
